<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
Sea Salt</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 40px;
        }
        .glaze-row {
            max-width: 1200px;
            margin: 0 auto 40px auto;
        }
        .glaze-row h2 {
            text-align: center;
            background-color: #d3d3d3;
            padding: 10px;
            margin-top: 0;
        }
        .glaze-row ul {
            list-style-type: none;
            padding-left: 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }
        .glaze-row li {
            margin: 10px;
            list-style: none;
            position: relative;
            text-align: center;
        }
        .glaze-row img {
            max-width: 200px;
            height: auto;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .glaze-row img:hover {
            transform: scale(1.05);
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            padding-top: 60px;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.9);
        }
        .modal-content {
            margin: auto;
            display: block;
            width: 80%;
            max-width: 700px;
        }
        .modal-content img {
            width: 100%;
            height: auto;
            border-radius: 8px;
        }
        .close {
            position: absolute;
            top: 30px;
            right: 35px;
            color: #ffffff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>
Sea Salt    </h1>
    <div class="glaze-row">
        <h2>Over</h2>
        <ul>
<li>
<img src="../glazes/sea-salt_norse-blue.jpeg" alt="sea-salt Over norse-blue" onclick="enlargeImage(this)"><p>Sea Salt Over Norse Blue</p></li>
<li>
<img src="../glazes/sea-salt_wintergreen.jpeg" alt="sea-salt Over wintergreen" onclick="enlargeImage(this)"><p>Sea Salt Over Wintergreen</p></li>
<li>
<img src="../glazes/sea-salt_leather.jpeg" alt="sea-salt Over leather" onclick="enlargeImage(this)"><p>Sea Salt Over Leather</p></li>
<li>
<img src="../glazes/sea-salt_celadon-bloom.jpeg" alt="sea-salt Over celadon-bloom" onclick="enlargeImage(this)"><p>Sea Salt Over Celadon Bloom</p></li>
        </ul>
    </div>

    <div class="glaze-row">
        <h2>Under</h2>
        <ul>
<li>
<img src="../glazes/norse-blue_sea-salt.jpeg" alt="norse-blue Over sea-salt" onclick="enlargeImage(this)"><p>Norse Blue Over Sea Salt</p></li>
<li>
<img src="../glazes/green-tea_sea-salt.jpeg" alt="green-tea Over sea-salt" onclick="enlargeImage(this)"><p>Green Tea Over Sea Salt</p></li>
<li>
<img src="../glazes/glacierblue_sea-salt.jpeg" alt="glacierblue Over sea-salt" onclick="enlargeImage(this)"><p>Glacierblue Over Sea Salt</p></li>
        </ul>
    </div>    <div id="myModal" class="modal" onclick="closeModal(event)">
        <span class="close" onclick="closeModal(event)">&times;</span>
        <div class="modal-content">
            <img id="modalImg" src="" alt="Enlarged Image">
        </div>
    </div>

    <script>
        function enlargeImage(imgElement) {
            const modal = document.getElementById("myModal");
            const modalImg = document.getElementById("modalImg");
            modal.style.display = "block";
            modalImg.src = imgElement.src;
        }

        function closeModal(event) {
            const modal = document.getElementById("myModal");
            const modalContent = document.querySelector('.modal-content img');

            if (event.target !== modalContent) {
                modal.style.display = "none";
            }
        }
    </script>
</body>
</html>
